# The shrunk (R8) build started in an Android 9 emulator: each page opened, no crash allowed.
# R8 can remove something only reached by name; this catches it before a beta.
name: R8 smoke test
on:
  push:
    branches: [main, r8]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r8-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the shrunk emulator APK
        run: chmod +x gradlew && ./gradlew --no-daemon -q :app:assembleEmulatorRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start it in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: sh scripts/r8_smoke.sh
