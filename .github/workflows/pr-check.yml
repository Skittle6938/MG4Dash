# Compilation et tests unitaires de la version émulateur : à chaque push sur main, sur les PR, et à la main.
name: PR check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and test
        run: chmod +x gradlew && ./gradlew --no-daemon -q testEmulatorDebugUnitTest assembleEmulatorDebug
      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testEmulatorDebugUnitTest
          if-no-files-found: ignore
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testEmulatorDebugUnitTest
            app/build/test-results/testEmulatorDebugUnitTest
          if-no-files-found: ignore
