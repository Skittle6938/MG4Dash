# Compilation et tests unitaires de la version émulateur : à chaque push sur main, sur les PR, et à la main.
name: PR check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Garde en cache la distribution Gradle du wrapper et les dépendances : plus de téléchargement
      # de services.gradle.org à chaque passage (échec « timeout (10000ms) » du 9 novembre)
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: chmod +x gradlew && ./gradlew --no-daemon -q testEmulatorDebugUnitTest :rescue:testDebugUnitTest assembleEmulatorDebug
      - name: Failed tests
        if: failure()
        run: |
          for f in app/build/test-results/*/TEST-*.xml rescue/build/test-results/*/TEST-*.xml; do
            [ -f "$f" ] && grep -q "<failure" "$f" && { echo "== $f"; grep -A12 "<failure" "$f" | head -60; }
          done || true
      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testEmulatorDebugUnitTest
            rescue/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
