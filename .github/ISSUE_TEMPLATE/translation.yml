name: Translation
description: A wrong or missing translation
labels: [translation, P3]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, French, German, Spanish, Italian, Dutch, Turkish, Other]
    validations:
      required: true
  - type: textarea
    id: texts
    attributes:
      label: Texts to change
      description: The current text, where it appears, and your suggestion. Translations live in i18n/strings.psv (one line per text, one column per language).
    validations:
      required: true
