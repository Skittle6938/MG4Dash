name: Feature request
description: An idea or an improvement
labels: [feature, P3]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options: [Home screen, Climate, Energy / consumption, Media / radio, Map, Weather, Phone, Update, Other]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you would like, and why it would help. A sketch or photo is welcome.
    validations:
      required: true
